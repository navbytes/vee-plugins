name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest is in sync with the repo
        run: python3 scripts/build-catalog.py --check

      - name: Manifest entries resolve and are complete
        run: |
          python3 - <<'PY'
          import json, pathlib
          m = json.load(open("vee-catalog.json"))
          assert m["vee_catalog"] == 1, "unsupported manifest version"
          seen = set()
          for p in m["plugins"]:
              path = pathlib.Path(p["path"])
              assert path.is_file(), f"missing: {path}"
              assert p["path"] not in seen, f"duplicate: {path}"
              assert p["summary"], f"no <xbar.desc>: {path}"
              assert p["title"], f"no <xbar.title>: {path}"
              seen.add(p["path"])
          print(f"{len(seen)} plugins OK")
          PY

      - name: Python syntax
        run: python3 -m py_compile */*.py scripts/*.py

      # Every plugin builds its output with the SDK, which must be vendored
      # beside it — both here and, at runtime, in the plugins folder. A missing
      # copy is an ImportError for every plugin in that folder.
      - name: Vendored SDK present wherever it is imported
        run: |
          fail=0
          for dir in System Developer Network Monitoring Productivity Showcase; do
            [ -d "$dir" ] || continue
            if ls "$dir"/*.py >/dev/null 2>&1 && grep -lqE '^from vee import|^import vee' "$dir"/*.py 2>/dev/null; then
              [ -f "$dir/vee.py" ] || { echo "::error::$dir imports vee but has no vee.py"; fail=1; }
            fi
            if ls "$dir"/*.ts >/dev/null 2>&1 && grep -lq 'from "\./vee\.ts"' "$dir"/*.ts 2>/dev/null; then
              [ -f "$dir/vee.ts" ] || { echo "::error::$dir imports ./vee.ts but has no vee.ts"; fail=1; }
            fi
          done
          exit $fail

      - name: Vendored SDK copies are identical
        run: |
          for sdk in vee.py vee.ts; do
            n=$(find . -name "$sdk" -not -path './.git/*' -exec md5sum {} + 2>/dev/null | awk '{print $1}' | sort -u | wc -l)
            [ "$n" -le 1 ] || { echo "::error::$sdk copies differ — run scripts/sync-sdk.sh"; exit 1; }
          done
          echo "SDK copies consistent"

      - name: Plugins import the vendored SDK, never npm
        run: |
          if grep -rn '"@navbytes/vee"' System Developer Network Monitoring Productivity Showcase 2>/dev/null; then
            echo "::error::import the vendored ./vee.ts, not @navbytes/vee — a bare specifier needs Vee 0.6.2+, and plugins here must run on older versions too"; exit 1
          fi
          echo "no npm specifiers"

      - name: SDK is not catalogued as a plugin
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("vee-catalog.json"))
          bad = [p["path"] for p in m["plugins"] if p["path"].rsplit("/", 1)[-1] in ("vee.py", "vee.ts", "vee.go")]
          assert not bad, f"vendored SDK catalogued as a plugin: {bad}"
          print(f"{len(m['plugins'])} plugins, no SDK entries")
          PY

      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          format: gcc
          scandir: './scripts'

      - name: Shebang matches extension
        run: |
          fail=0
          # vee.py / vee.ts are the vendored SDK — libraries, not plugins, so
          # they carry no shebang. Vee's own discovery skips them by name too.
          for f in */*.py; do
            case "$(basename "$f")" in vee.py) continue;; esac
            head -1 "$f" | grep -q 'python3' || { echo "::error file=$f::.py with a non-python shebang"; fail=1; }
          done
          for f in */*.ts; do
            case "$(basename "$f")" in vee.ts) continue;; esac
            head -1 "$f" | grep -q 'node' || { echo "::error file=$f::.ts with a non-node shebang"; fail=1; }
          done
          for f in */*.swift; do
            head -1 "$f" | grep -q 'swift' || { echo "::error file=$f::.swift with a non-swift shebang"; fail=1; }
          done
          exit $fail

      # Swift plugins can only be typechecked on macOS with the Xcode CLT, which
      # this runner does not have. Gate the cheap structural things here and
      # leave `swiftc -typecheck` to the authoring loop.
      - name: Swift plugins declare their toolchain dependency
        run: |
          fail=0
          for f in */*.swift; do
            grep -q 'Command Line Tools' "$f" || { echo "::error file=$f::must state the Xcode CLT dependency"; fail=1; }
          done
          exit $fail

      # House convention: this is a Vee store, so headers use the <vee.*>
      # spelling. Vee reads all three namespaces identically, so this is style,
      # not function — but it is the line between a converted plugin and a
      # copied one, and it only stays true if something checks.
      - name: Headers use the <vee.*> namespace
        run: |
          if grep -rlE '<(/?)(xbar|swiftbar)\.' System Developer Network Monitoring Productivity Showcase; then
            echo "::error::plugin headers must use <vee.*>, not <xbar.*>/<swiftbar.*>"; exit 1
          fi
          echo "all plugin headers use <vee.*>"

      - name: No plugin ships executable (users chmod after reading)
        run: |
          if find . -path ./.git -prune -o \( -name '*.py' -o -name '*.ts' -o -name '*.swift' \) -not -path './scripts/*' -perm -u+x -print | grep .; then
            echo "::error::plugins must ship non-executable"; exit 1
          fi
