name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' > paths.txt
          if grep -Ev '^(docs/|README[^/]*\.md$|CHANGELOG[^/]*\.md$|LICENSE[^/]*$|\.github/AUTOMATION\.md$)' paths.txt | grep -q .; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi

  check:
    if: ((github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)) && needs.changes.outputs.relevant == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Manifest is in sync with the repo
        run: python3 scripts/build-catalog.py --check

      - name: Manifest entries resolve and are complete
        run: |
          python3 - <<'PY'
          import json, pathlib
          m = json.load(open("vee-catalog.json"))
          assert m["vee_catalog"] == 1, "unsupported manifest version"
          seen = set()
          for p in m["plugins"]:
              path = pathlib.Path(p["path"])
              assert path.is_file(), f"missing: {path}"
              assert p["path"] not in seen, f"duplicate: {path}"
              assert p["summary"], f"no <xbar.desc>: {path}"
              assert p["title"], f"no <xbar.title>: {path}"
              seen.add(p["path"])
          print(f"{len(seen)} plugins OK")
          PY

      - name: Python syntax
        run: python3 -m py_compile */*.py scripts/*.py

      # Plugins are dependency-free executables — no SDK import, no vendored
      # SDK file. `scripts/build-catalog.py --check` (above) already rejects a
      # committed vee.py/vee.ts; this catches the import itself.
      - name: No plugin imports an SDK
        run: |
          if grep -rlE '^from vee import|^import vee' System Developer Network Monitoring Productivity Showcase 2>/dev/null; then
            echo "::error::plugins are dependency-free — build the output format directly, don't import vee"; exit 1
          fi
          if grep -rlE '"@navbytes/vee"|from "\./vee(\.ts|\.js)?"' System Developer Network Monitoring Productivity Showcase 2>/dev/null; then
            echo "::error::plugins are dependency-free — build the output format directly, don't import ./vee.ts or @navbytes/vee"; exit 1
          fi
          echo "no SDK imports"

      - uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          severity: warning
          format: gcc
          scandir: './scripts'

      - name: Shebang matches extension
        run: |
          fail=0
          for f in */*.py; do
            head -1 "$f" | grep -q 'python3' || { echo "::error file=$f::.py with a non-python shebang"; fail=1; }
          done
          for f in */*.ts; do
            head -1 "$f" | grep -q 'node' || { echo "::error file=$f::.ts with a non-node shebang"; fail=1; }
          done
          for f in */*.swift; do
            head -1 "$f" | grep -q 'swift' || { echo "::error file=$f::.swift with a non-swift shebang"; fail=1; }
          done
          exit $fail

      # Swift plugins can only be typechecked on macOS with the Xcode CLT, which
      # this runner does not have. Gate the cheap structural things here and
      # leave `swiftc -typecheck` to the authoring loop.
      - name: Swift plugins declare their toolchain dependency
        run: |
          fail=0
          for f in */*.swift; do
            grep -q 'Command Line Tools' "$f" || { echo "::error file=$f::must state the Xcode CLT dependency"; fail=1; }
          done
          exit $fail

      # House convention: this is a Vee store, so headers use the <vee.*>
      # spelling. Vee reads all three namespaces identically, so this is style,
      # not function — but it is the line between a converted plugin and a
      # copied one, and it only stays true if something checks.
      - name: Headers use the <vee.*> namespace
        run: |
          if grep -rlE '<(/?)(xbar|swiftbar)\.' System Developer Network Monitoring Productivity Showcase; then
            echo "::error::plugin headers must use <vee.*>, not <xbar.*>/<swiftbar.*>"; exit 1
          fi
          echo "all plugin headers use <vee.*>"

      - name: No plugin ships executable (users chmod after reading)
        run: |
          if find . -path ./.git -prune -o \( -name '*.py' -o -name '*.ts' -o -name '*.swift' \) -not -path './scripts/*' -perm -u+x -print | grep .; then
            echo "::error::plugins must ship non-executable"; exit 1
          fi
